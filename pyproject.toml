[build-system]
requires=["hatchling>=1.26"]
build-backend="hatchling.build"

[project]
name="dcc-mcp-freecad"
version="0.1.0"
description="FreeCAD adapter foundation for DCC-MCP"
readme="README.md"
requires-python=">=3.9"
license={text="MIT"}
authors=[{name="loonghao",email="hal.long@outlook.com"}]
dependencies=["dcc-mcp-core>=0.19.45,<1.0.0"]

[project.optional-dependencies]
test=["pytest>=8","ruff>=0.8"]

[project.scripts]
dcc-mcp-freecad="dcc_mcp_freecad.server:main"

[project.entry-points."dcc_mcp.adapters"]
freecad="dcc_mcp_freecad:FreecadMcpServer"

[tool.hatch.build.targets.wheel]
packages=["src/dcc_mcp_freecad"]
artifacts=["src/dcc_mcp_freecad/skills/**"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src","."]

[tool.ruff.lint]
select=["E","F","I","B"]
