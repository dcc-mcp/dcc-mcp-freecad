tools:
  - name: get_status
    description: Verify the configured native FreeCAD backend, version, Python runtime, workspace roots, and limits.
    source_file: scripts/get_status.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: get_capabilities
    description: List typed document/modeling methods, primitives, booleans, formats, and safety boundaries.
    source_file: scripts/get_capabilities.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: list_documents
    description: >-
      Discover FCStd documents under the allowed roots without opening any of
      them. Returns a bounded, paginated listing (path relative to the root it
      was found under, absolute path ready for inspect_document, size,
      modification time, and a bounded SHA-256). Purely a filesystem
      enumeration: no FreeCAD process is started, no document is opened or
      recomputed, and nothing is written. A root outside the allowed roots is
      refused with an error rather than silently returning nothing.

      Entries are sorted by path, and the serialized size of the entries array
      is capped at 256 KiB; the response envelope (roots, pattern, and the
      paging and budget counters) is not counted against that cap.

      The page is a slice of the sorted set the scan actually reached, not a
      prefix of the full sorted result. When the scan budget runs out the walk
      stops early, so the sorted set is a subset of the real matches and the
      files beyond the stopping point were never visited: no offset reaches
      them. In that case truncated is true and next_offset is null -- narrow
      root or pattern instead of paging on. A listing can also stop on the
      per-page, entries-byte, or checksum read budget; the scan_budget_exhausted
      and read_budget_exhausted counters say which.
    source_file: scripts/list_documents.py
    input_schema:
      type: object
      properties:
        root:
          type: string
          minLength: 1
          description: >-
            Directory to search, resolved like any document path. Omit it to
            search every allowed root. An explicit root must itself be inside
            DCC_MCP_FREECAD_ALLOWED_ROOTS.
        pattern:
          type: string
          minLength: 1
          maxLength: 128
          default: "*.FCStd"
          description: >-
            Case-insensitive glob matched against the file name only, never a
            path. Narrow root instead of matching directories.
        recursive:
          type: boolean
          default: true
          description: Include subdirectories. Symlinked directories and files are always skipped.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
          description: Maximum entries to return. A response byte budget also applies, so fewer may be returned.
        offset:
          type: integer
          minimum: 0
          description: Entries to skip before collecting a page. Use next_offset from the previous page.
        include_object_count:
          type: boolean
          default: false
          description: >-
            Read each archive's object count from its stored document index.
            Costs one bounded read per entry and returns null when the index is
            missing, oversized, or unreadable.
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples:
      - arguments: {}
      - arguments: {root: "projects", pattern: "*.FCStd", limit: 20}
      - arguments: {pattern: "bracket-*.FCStd", include_object_count: true}
    next-tools: {on-success: [inspect_document, create_document], on-failure: [get_status]}

  - name: create_document
    description: Create an empty durable FCStd document with atomic destination replacement.
    source_file: scripts/create_document.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1}
        overwrite: {type: boolean, default: false}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    call_examples:
      - arguments: {path: "projects/enclosure.FCStd"}
    next-tools: {on-success: [inspect_document], on-failure: [get_status]}

  - name: inspect_document
    description: Inspect document metadata, objects, links, placements, shapes, meshes, and bounding boxes.
    source_file: scripts/inspect_document.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    call_examples:
      - arguments: {path: "projects/enclosure.FCStd"}

  - name: validate_document
    description: Recompute an FCStd document and report invalid or empty Part shapes.
    source_file: scripts/validate_document.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    next-tools: {on-failure: [inspect_document, get_status]}

  - name: save_copy
    description: Save an FCStd document to a new output path without changing the source. Publication is atomic for overwrite=true and for the hard-link path used by overwrite=false. Where the output volume has no hard-link support (FAT/exFAT, some SMB/FUSE mounts), overwrite=false falls back to an exclusive create plus copy, which never replaces the destination but is not atomic - a concurrent reader can observe a partially written .fcstd. Publication fails with a hard-link error and the overwrite=true escape hatch if neither is available. Explicit overwrite uses atomic replacement.
    source_file: scripts/save_copy.py
    input_schema:
      type: object
      required: [source_path, output_path]
      properties:
        source_path: {type: string, minLength: 1}
        output_path: {type: string, minLength: 1}
        overwrite: {type: boolean, default: false}
        visible_objects:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'}
          description: Optional explicit top-level non-container native view-provider selection; group members are rejected. Requires the installed FreeCAD GUI library.
        view: {type: string, enum: [isometric, front, top, right], default: isometric}
        appearances:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: Optional uniform native Part colors. Names must be unique members of visible_objects with non-null Part shapes and initially uniform face RGB and transparency. RGB and opacity are finite fractions. Applied RGB uses native float32 scaling to nearest 8-bit channels (ties upward); opacity uses the nearest 1 percent (transparency ties upward). Original values are returned in presentation_request and applied values in presentation.appearances.
          items:
            type: object
            required: [object_name, rgb, opacity]
            additionalProperties: false
            properties:
              object_name: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'}
              rgb:
                type: array
                minItems: 3
                maxItems: 3
                items: {type: number, minimum: 0, maximum: 1}
              opacity: {type: number, minimum: 0, maximum: 1}
        frame_margin:
          type: number
          minimum: 0
          maximum: 1
          description: Optional extra fraction of fitted orthographic camera height at each side. Final height is fitted_height * (1 + 2 * frame_margin), not a guarantee of pixel padding. Requires visible_objects.
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      dependencies:
        appearances: [visible_objects]
        frame_margin: [visible_objects]
      if:
        required: [view]
        properties:
          view: {enum: [front, top, right]}
      then:
        required: [visible_objects]
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}

  - name: render_view
    description: >-
      Render an FCStd document view to a PNG in an isolated headless process and prove the
      frame is not waste before returning it. The document is opened read-only and never
      saved, so the source is byte-for-byte unchanged; the frame is written to a staging file
      and measured before publication, so a rejected frame never reaches output_path. This
      tool is read-only with respect to the document. Framing the scene requires moving the
      camera and changing visibility, so the native camera, visibility and selection are
      recorded first and restored afterwards, and that restoration is a byte-exact read-back
      check reported as render.view_state_restored. Two captures are always taken, one as
      requested and one with every object hidden at the identical camera. FreeCAD's default
      3D-view background is a linear gradient that is baked into the saved PNG, so an entirely
      empty render already has plenty of pixel variance and would pass any "is it
      monochrome?" test; comparing the pair is what actually distinguishes "the model
      rendered" from "the background rendered". A flat fill fails with error_code
      degenerate_render; a frame that does not differ from the empty scene by at least 0.5
      percent of its pixels fails with empty_render. Both carry pixel statistics, the measured
      fraction, and remediation instead of an image. Requires the installed FreeCAD GUI
      library; a host without FreeCADGui cannot render and is reported as host_limited by
      get_capabilities rather than silently returning nothing. Rendering also needs the Qt
      offscreen platform and a working software GL path. The image is NOT returned by default.
      include_image defaults to false so a visual check does not silently consume context on
      every call; the default response is text, being whether the render is usable, the pixel
      summary, the view, and what was in frame. With output_path omitted the frame is measured
      and discarded, leaving no artefact. With output_path given it must end with .png and be
      inside the allowed roots; an existing destination requires overwrite=true, and
      no-overwrite publication is exclusive exactly as save_copy publishes.
    source_file: scripts/render_view.py
    input_schema:
      type: object
      required: [document_path]
      properties:
        document_path: {type: string, minLength: 1}
        output_path: {type: string, minLength: 1, description: 'Optional .png destination inside the allowed roots. Omitted means render, measure and discard.'}
        overwrite: {type: boolean, default: false}
        visible_objects:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'}
          description: Optional explicit top-level non-container native view-provider selection; group members are rejected. Omitted selects every top-level non-container object. Requires the installed FreeCAD GUI library.
        view: {type: string, enum: [isometric, front, top, right], default: isometric}
        appearances:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: Optional uniform native Part colors, changing only this render and never the document. Names must be unique members of visible_objects with non-null Part shapes and initially uniform face RGB and transparency. Requires visible_objects.
          items:
            type: object
            required: [object_name, rgb, opacity]
            additionalProperties: false
            properties:
              object_name: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'}
              rgb:
                type: array
                minItems: 3
                maxItems: 3
                items: {type: number, minimum: 0, maximum: 1}
              opacity: {type: number, minimum: 0, maximum: 1}
        frame_margin:
          type: number
          minimum: 0
          maximum: 1
          description: Optional extra fraction of fitted orthographic camera height at each side. Final height is fitted_height * (1 + 2 * frame_margin), not a guarantee of pixel padding. Requires visible_objects.
        width: {type: integer, minimum: 16, maximum: 1280, default: 1280}
        height: {type: integer, minimum: 16, maximum: 720, default: 720}
        include_image: {type: boolean, default: false, description: 'Attach the rendered PNG as base64. Off by default because returning a picture on every call is a context cost, not a feature.'}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 300}
      dependencies:
        appearances: [visible_objects]
        frame_margin: [visible_objects]
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    call_examples:
      - arguments: {document_path: "projects/enclosure.FCStd", view: isometric}
      - arguments: {document_path: "projects/enclosure.FCStd", output_path: "renders/enclosure.png", view: front, include_image: true}
    next-tools: {on-failure: [get_status, inspect_document]}

  - name: remove_object
    description: Remove an object, refusing dependents unless cascade removal is explicit.
    source_file: scripts/remove_object.py
    input_schema:
      type: object
      required: [document_path, object_name]
      properties:
        document_path: {type: string, minLength: 1}
        object_name: {type: string, minLength: 1, maxLength: 64}
        cascade: {type: boolean, default: false}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    next-tools: {on-success: [inspect_document, validate_document], on-failure: [inspect_document]}

  - name: create_snapshot
    description: Copy a document's bytes into the snapshot store so a later call can restore them. The document is not modified. Takes no FreeCAD process, so it works when the host is unavailable.
    source_file: scripts/create_snapshot.py
    input_schema:
      type: object
      required: [document_path]
      properties:
        document_path: {type: string, minLength: 1}
        label: {type: string, minLength: 1, maxLength: 200}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    call_examples:
      - arguments: {document_path: "projects/enclosure.FCStd", label: "before boolean cut"}
    next-tools: {on-success: [list_snapshots], on-failure: [list_snapshots, get_status]}

  - name: list_snapshots
    description: List restorable snapshots with their source document, SHA-256, size, origin, and the store limits they count against. document_path filters by source document and need not exist.
    source_file: scripts/list_snapshots.py
    input_schema:
      type: object
      properties:
        document_path: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples:
      - arguments: {document_path: "projects/enclosure.FCStd"}

  - name: restore_snapshot
    description: Replace a document with a stored snapshot. Refuses when expected_sha256 does not match the document as it stands, and snapshots the state it replaces first so the restore is itself undoable.
    source_file: scripts/restore_snapshot.py
    input_schema:
      type: object
      required: [document_path, snapshot_id]
      properties:
        document_path: {type: string, minLength: 1}
        snapshot_id: {type: string, minLength: 1, maxLength: 128}
        expected_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-fA-F]{64}$'
          description: Optimistic concurrency token. When given, the restore is refused unless the document still hashes to this value, so new work is never silently overwritten.
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    call_examples:
      - arguments: {document_path: "projects/enclosure.FCStd", snapshot_id: "20261007T021530.123456Z-a1b2c3d4e5f6"}
    next-tools: {on-success: [inspect_document, validate_document], on-failure: [list_snapshots]}

  - name: run_script
    description: >-
      Execute one caller-supplied .py file inside a disposable, isolated
      FreeCADCmd child process. This is the escape hatch for work no typed tool
      covers, and it is not a sandbox: the script runs as the operator's account
      with that account's full privileges, and allowed roots constrain only
      which file may be named. The child starts with --safe-mode and a throwaway
      user config, so no user workbench, plugin, or macro is loaded. Only a path
      is accepted, never source text. The script is responsible for its own
      persistence; stdout/stderr are truncated at 65536 characters per stream
      with *_truncated flags, and exit_code is reported on success as well as on
      failure. A hang is killed at the deadline and returned as an error with
      error code script_timeout, carrying timed_out: true and whatever the
      script printed before it was terminated; a non-zero exit code is a normal
      result, not an error.
    source_file: scripts/run_script.py
    input_schema:
      type: object
      required: [script_path]
      properties:
        script_path:
          type: string
          minLength: 1
          description: Path to an existing .py file. Resolved (symlinks followed) and then required to lie inside DCC_MCP_FREECAD_ALLOWED_ROOTS, the same gate every other path argument goes through.
        timeout_secs: {type: number, minimum: 1, maximum: 300, default: 300}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: true, deferred_hint: true}
    call_examples:
      - arguments: {script_path: "scripts/batch_export.py"}
    next-tools: {on-success: [inspect_document], on-failure: [get_status]}

  - name: delete_snapshot
    description: Delete one snapshot to free store capacity. The source document is never touched. Refuses unknown ids; orphaned files without metadata must be removed from the store directory manually.
    source_file: scripts/delete_snapshot.py
    input_schema:
      type: object
      required: [snapshot_id]
      properties:
        snapshot_id: {type: string, minLength: 1, maxLength: 128}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: false}
    call_examples:
      - arguments: {snapshot_id: "20261007T021530.123456Z-a1b2c3d4e5f6"}
    next-tools: {on-success: [list_snapshots], on-failure: [list_snapshots]}
