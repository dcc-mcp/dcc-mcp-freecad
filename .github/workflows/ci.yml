name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release-please--branches--**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.7"}
          - {os: windows-2022, python: "3.7"}
          - {os: ubuntu-latest, python: "3.9"}
          - {os: windows-latest, python: "3.9"}
          - {os: macos-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Doctor contract smoke
        run: python -m pytest tests/test_doctor.py -q
      - run: python -m pytest -m "not freecad"

  # Real-hardware coverage: the `-m "not freecad"` contract job above never
  # exercises FreeCAD itself, so a host API break stays invisible until release.
  # This job installs a pinned official FreeCAD and runs the tests that do.
  # The count asserted below is the number of `-m "freecad and not freecad_gui"`
  # cases, so adding or removing one of those tests requires updating it; the
  # guard exists so a collection failure cannot pass as a green run.
  # Installed via AppImage + `--appimage-extract`; the FreeCAD snap is unusable
  # on GitHub runners (it core-dumps).
  freecad-real:
    name: Real FreeCAD ${{ matrix.freecad_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two release lines: the API surface moved between 1.0 and 1.1.
          - os: ubuntu-latest
            freecad_version: "1.0.2"
            freecad_asset: FreeCAD_1.0.2-conda-Linux-x86_64-py311.AppImage
          - os: ubuntu-latest
            freecad_version: "1.1.4"
            freecad_asset: FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      # The GUI lane drives real view-provider capture. `QT_QPA_PLATFORM=offscreen`
      # alone still makes the 3D view ask for an OpenGL context, and a GitHub
      # runner has no GPU and no X display, so the view dies with
      # "QOpenGLWidget: Failed to create context". Mesa's software rasteriser
      # plus an X server is what supplies that context headlessly; the fonts
      # package stops the bridge's isolated HOME from making fontconfig log a
      # fatal-looking error on every call.
      - name: Install headless GL and X prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dri libglx-mesa0 libegl1 libxkbcommon-x11-0 \
            libdbus-1-3 xvfb fonts-dejavu-core
      - name: Record resolved dcc-mcp-core
        run: |
          python -c "import importlib.metadata as m; print('dcc-mcp-core==%s' % m.version('dcc-mcp-core'))" | tee core-version.txt
      - name: Cache FreeCAD AppImage
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/freecad-${{ matrix.freecad_version }}/*.AppImage
            ${{ runner.temp }}/freecad-${{ matrix.freecad_version }}/*.AppImage-SHA256.txt
          key: freecad-appimage-${{ runner.os }}-${{ matrix.freecad_asset }}
      - name: Install FreeCAD ${{ matrix.freecad_version }}
        env:
          FREECAD_VERSION: ${{ matrix.freecad_version }}
          FREECAD_ASSET: ${{ matrix.freecad_asset }}
        run: bash .github/scripts/install-freecad.sh
      - name: Real FreeCAD end-to-end
        run: |
          echo "FreeCAD ${FREECAD_REAL_VERSION} via ${FREECAD_TEST_EXECUTABLE}"
          python -m pytest -m "freecad and not freecad_gui" -v --junitxml=freecad-real-${{ matrix.freecad_version }}.xml
      - name: Assert the real test executed
        if: always()
        run: python3 .github/scripts/verify-freecad-run.py freecad-real-${{ matrix.freecad_version }}.xml 38
      - name: Real native GUI presentation persistence
        # xvfb gives the Qt offscreen platform the X display it expects, so the
        # 3D view can create a context from Mesa's software rasteriser.
        run: xvfb-run -a python -m pytest -m freecad_gui -v --junitxml=freecad-gui-${{ matrix.freecad_version }}.xml
      - name: Assert GUI cases executed without skips
        if: always()
        run: python3 .github/scripts/verify-freecad-run.py freecad-gui-${{ matrix.freecad_version }}.xml 38
      - name: Upload real run report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: freecad-real-${{ matrix.freecad_version }}
          path: |
            freecad-real-${{ matrix.freecad_version }}.xml
            freecad-gui-${{ matrix.freecad_version }}.xml
          retention-days: 7

  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel entry-point smoke
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/dcc-mcp-freecad --version
